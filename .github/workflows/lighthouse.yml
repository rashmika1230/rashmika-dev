name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lighthouse serves dist/ from the server root, so build without the /rashmika base path.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.16.x autorun
